name: Back up cloud work logs

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download a portable JSON snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p backups
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/work_log_snapshots?select=user_id,data,updated_at" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" | jq --sort-keys . > backups/latest.json
          cp backups/latest.json "backups/$(date -u +%F).json"
      - name: Commit only when the backup changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backups
          git diff --cached --quiet && exit 0
          git commit -m "Backup work logs $(date -u +%F)"
          git push
